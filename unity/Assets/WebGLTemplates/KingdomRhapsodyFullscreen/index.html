<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>王國狂想</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0f1a28;
      color: #fff;
      font: 16px system-ui, sans-serif;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #0f1a28;
    }

    #unity-status {
      position: fixed;
      inset: 50% auto auto 50%;
      width: max-content;
      max-width: 90%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    #unity-fullscreen {
      position: fixed;
      right: 12px;
      bottom: 12px;
      padding: 8px 12px;
      border: 1px solid #ffffff50;
      border-radius: 6px;
      background: #0f1a28d9;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    #unity-fullscreen:hover {
      background: #25354a;
    }

    @media (max-aspect-ratio: 3/4) {
      #unity-fullscreen {
        display: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1" aria-label="王國狂想"></canvas>
  <div id="unity-status" role="status">載入中</div>
  <button id="unity-fullscreen" type="button" hidden>全螢幕</button>

  <script>
    const canvas = document.getElementById("unity-canvas");
    const statusMessage = document.getElementById("unity-status");
    const fullscreenButton = document.getElementById("unity-fullscreen");
    const build = "Build/";
    const config = {
      dataUrl: build + {{{ JSON.stringify(DATA_FILENAME) }}},
      frameworkUrl: build + {{{ JSON.stringify(FRAMEWORK_FILENAME) }}},
      codeUrl: build + {{{ JSON.stringify(CODE_FILENAME) }}},
#if SYMBOLS_FILENAME
      symbolsUrl: build + {{{ JSON.stringify(SYMBOLS_FILENAME) }}},
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true,
      showBanner(message, type) {
        if (type === "error") {
          showError(message);
        } else {
          console.warn(message);
        }
      },
    };

    function showError(error) {
      statusMessage.hidden = false;
      statusMessage.textContent = "遊戲發生錯誤，請重新整理網頁。";
      console.error(error);
    }

    const loader = document.createElement("script");
    loader.src = build + {{{ JSON.stringify(LOADER_FILENAME) }}};
    loader.onerror = () => showError("Could not load " + loader.src);
    loader.onload = async () => {
      try {
        const instance = await createUnityInstance(canvas, config, (progress) => {
          statusMessage.textContent = "載入中 " + Math.round(progress * 100) + "%";
        });
        statusMessage.hidden = true;
        if (document.fullscreenEnabled) {
          fullscreenButton.onclick = () => instance.SetFullscreen(1);
          fullscreenButton.hidden = false;
        }
      } catch (error) {
        showError(error);
      }
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>
